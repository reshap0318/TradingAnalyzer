name: trading-bot
services:
  webserver:
    image: nginx:alpine
    container_name: trading.webserver
    restart: unless-stopped
    tty: true
    depends_on:
      - backend
      - frontend
    ports:
      - "9001:80"
    volumes:
      - ./:/var/www/
      - ./etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - trading-network

  backend:
    build:
      context: .
      dockerfile: etc/go/Dockerfile
    image: trading.be/v:0.0.1
    container_name: trading.be
    ports:
      - "9000:9000"
    expose:
      - "9000"
    env_file:
      - ./be/.env
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./be:/app
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    extra_hosts:
      - "api.binance.com:13.225.103.45"
      - "api1.binance.com:13.225.103.45"
      - "api2.binance.com:13.225.103.45"
      - "api3.binance.com:13.225.103.45"
    networks:
      - trading-network
      - mysql-network
      - redis-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9000/health",
        ]
      interval: 300s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: ./etc/node/Dockerfile
    image: trading.fe/v:0.0.1
    container_name: trading.fe
    restart: unless-stopped
    tty: true
    depends_on:
      - backend
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./fe:/app
      - /app/node_modules
    working_dir: /app
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
    name: trading-network
  mysql-network:
    driver: bridge
    name: mysql-network
    external: true
  redis-network:
    driver: bridge
    name: redis-network
    external: true
